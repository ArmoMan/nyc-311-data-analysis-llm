name: CI/CD Pipeline Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1. CONTINUOUS INTEGRATION (CI) STAGE
  # ------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the repository code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up the language runtime environment
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install application dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Check code style/formatting (Linting)
      # - name: Run linter
      #   run: python -m flake8

      # Step 5: Execute unit tests
      - name: Run tests
        run: python -m pytest

